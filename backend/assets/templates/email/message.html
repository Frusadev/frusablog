<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from {{ site_name or 'ametsowou.me' }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header {
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .site-name {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .date {
            color: #7f8c8d;
            font-size: 14px;
            margin: 5px 0 0 0;
        }
        .message-content {
            font-size: 16px;
            margin: 20px 0;
            white-space: pre-wrap;
        }
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="site-name">{{ site_name or 'ametsowou.me' }}</h1>
            <p class="date">{{ message_date }}</p>
        </div>
        
        <div class="message-content">{{ message_content }}</div>
        
        <div class="footer">
            This message was sent from {{ site_name or 'ametsowou.me' }}
        </div>
    </div>
</body>
</html>
